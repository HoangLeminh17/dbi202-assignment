<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Goi y game tuong tu - game_id {{ game_id }}</title>
</head>
<body>
  <p><a href="/">&larr; Quay lai danh sach</a></p>
  <h1>Goi y game tuong tu voi game_id = {{ game_id }}</h1>
  <table border="1" cellpadding="6">
    <tr>
      <th>Game</th>
      <th>Do tuong dong (similarity)</th>
      <th>Tong doanh so</th>
    </tr>
    {% for r in recommendations %}
    <tr>
      <td>{{ r.game_name }}</td>
      <td>{{ "%.3f"|format(r.similarity) }}</td>
      <td>{{ "%.2f"|format(r.total_sales) }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
