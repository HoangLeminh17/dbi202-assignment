<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1340" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1900" height="1340" fill="#ffffff"/>

  <text x="950" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">ERD - Group7 Video Game Sales (ky hieu Chen)</text>

  <!-- ============ LINES (ve truoc de nam duoi cac hinh) ============ -->
  <g stroke="#333333" stroke-width="2" fill="none">
    <!-- Genre - Classifies - Game -->
    <line x1="350" y1="220" x2="470" y2="280"/>
    <line x1="490" y1="320" x2="700" y2="420"/>
    <!-- Game - Published_as - Game_Publisher -->
    <line x1="870" y1="490" x2="870" y2="518"/>
    <line x1="870" y1="602" x2="870" y2="620"/>
    <!-- Publisher - Publishes - Game_Publisher -->
    <line x1="1560" y1="230" x2="1300" y2="388"/>
    <line x1="1300" y1="472" x2="990" y2="640"/>
    <!-- Game_Publisher - Released_on - Game_Platform -->
    <line x1="870" y1="710" x2="870" y2="738"/>
    <line x1="870" y1="822" x2="870" y2="870"/>
    <!-- Platform - Hosts - Game_Platform -->
    <line x1="1560" y1="820" x2="1300" y2="838"/>
    <line x1="1300" y1="852" x2="990" y2="900"/>
    <!-- Game_Platform - Sold_in - Region -->
    <line x1="870" y1="960" x2="870" y2="1008"/>
    <line x1="870" y1="1092" x2="870" y2="1150"/>
    <!-- Sold_in - num_sales attribute -->
    <line x1="918" y1="1050" x2="1145" y2="1040"/>
    <!-- Sold_in - updated_at attribute -->
    <line x1="918" y1="1050" x2="1145" y2="1140"/>
  </g>

  <!-- ============ ATTRIBUTE - ENTITY connector lines (mau nhat) ============ -->
  <g stroke="#8fbf95" stroke-width="1.5" fill="none">
    <line x1="200" y1="100" x2="235" y2="150"/>
    <line x1="330" y1="103" x2="290" y2="150"/>
    <line x1="670" y1="350" x2="750" y2="400"/>
    <line x1="915" y1="350" x2="860" y2="400"/>
    <line x1="1595" y1="100" x2="1610" y2="150"/>
    <line x1="1770" y1="103" x2="1700" y2="150"/>
    <line x1="675" y1="748" x2="790" y2="660"/>
    <line x1="1595" y1="703" x2="1610" y2="770"/>
    <line x1="1770" y1="703" x2="1700" y2="770"/>
    <line x1="675" y1="895" x2="790" y2="900"/>
    <line x1="675" y1="985" x2="790" y2="930"/>
    <line x1="675" y1="1280" x2="790" y2="1220"/>
    <line x1="905" y1="1280" x2="880" y2="1240"/>
  </g>

  <!-- ============ ENTITIES (hinh chu nhat) ============ -->
  <g>
    <!-- Genre -->
    <rect x="150" y="150" width="200" height="80" rx="2" fill="#dbe9fb" stroke="#2c4870" stroke-width="2.5"/>
    <text x="250" y="196" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324a">Genre</text>

    <!-- Game -->
    <rect x="700" y="400" width="220" height="90" rx="2" fill="#dbe9fb" stroke="#2c4870" stroke-width="2.5"/>
    <text x="810" y="451" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324a">Game</text>

    <!-- Publisher -->
    <rect x="1550" y="150" width="200" height="80" rx="2" fill="#dbe9fb" stroke="#2c4870" stroke-width="2.5"/>
    <text x="1650" y="196" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324a">Publisher</text>

    <!-- Game_Publisher -->
    <rect x="750" y="620" width="240" height="90" rx="2" fill="#dbe9fb" stroke="#2c4870" stroke-width="2.5"/>
    <text x="870" y="671" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324a">Game_Publisher</text>

    <!-- Platform -->
    <rect x="1550" y="770" width="200" height="80" rx="2" fill="#dbe9fb" stroke="#2c4870" stroke-width="2.5"/>
    <text x="1650" y="816" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324a">Platform</text>

    <!-- Game_Platform -->
    <rect x="750" y="870" width="240" height="90" rx="2" fill="#dbe9fb" stroke="#2c4870" stroke-width="2.5"/>
    <text x="870" y="921" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324a">Game_Platform</text>

    <!-- Region -->
    <rect x="750" y="1150" width="240" height="90" rx="2" fill="#dbe9fb" stroke="#2c4870" stroke-width="2.5"/>
    <text x="870" y="1201" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324a">Region</text>
  </g>

  <!-- ============ RELATIONSHIPS (hinh thoi) ============ -->
  <g>
    <!-- Classifies: Genre 1 to N Game -->
    <polygon points="480,255 575,300 480,345 385,300" fill="#fdf1cf" stroke="#c9971b" stroke-width="2.5"/>
    <text x="480" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b4d0a">Classifies</text>
    <text x="395" y="255" font-size="15" font-weight="bold" fill="#111">1</text>
    <text x="640" y="380" font-size="15" font-weight="bold" fill="#111">N</text>

    <!-- Published_as: Game 1 to N Game_Publisher -->
    <polygon points="870,518 918,560 870,602 822,560" fill="#fdf1cf" stroke="#c9971b" stroke-width="2.5"/>
    <text x="870" y="565" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b4d0a">Published_as</text>
    <text x="885" y="510" font-size="15" font-weight="bold" fill="#111">1</text>
    <text x="885" y="618" font-size="15" font-weight="bold" fill="#111">N</text>

    <!-- Publishes: Publisher 1 to N Game_Publisher -->
    <polygon points="1300,388 1360,430 1300,472 1240,430" fill="#fdf1cf" stroke="#c9971b" stroke-width="2.5"/>
    <text x="1300" y="435" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b4d0a">Publishes</text>
    <text x="1470" y="290" font-size="15" font-weight="bold" fill="#111">1</text>
    <text x="1050" y="620" font-size="15" font-weight="bold" fill="#111">N</text>

    <!-- Released_on: Game_Publisher 1 to N Game_Platform -->
    <polygon points="870,738 918,780 870,822 822,780" fill="#fdf1cf" stroke="#c9971b" stroke-width="2.5"/>
    <text x="870" y="785" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b4d0a">Released_on</text>
    <text x="885" y="730" font-size="15" font-weight="bold" fill="#111">1</text>
    <text x="885" y="838" font-size="15" font-weight="bold" fill="#111">N</text>

    <!-- Hosts: Platform 1 to N Game_Platform -->
    <polygon points="1300,800 1370,845 1300,890 1230,845" fill="#fdf1cf" stroke="#c9971b" stroke-width="2.5"/>
    <text x="1300" y="850" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b4d0a">Hosts</text>
    <text x="1500" y="800" font-size="15" font-weight="bold" fill="#111">1</text>
    <text x="1050" y="905" font-size="15" font-weight="bold" fill="#111">N</text>

    <!-- Sold_in: Game_Platform N to N Region -->
    <polygon points="870,1008 918,1050 870,1092 822,1050" fill="#fdf1cf" stroke="#c9971b" stroke-width="2.5"/>
    <text x="870" y="1055" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b4d0a">Sold_in</text>
    <text x="885" y="1000" font-size="15" font-weight="bold" fill="#111">N</text>
    <text x="885" y="1108" font-size="15" font-weight="bold" fill="#111">N</text>
  </g>

  <!-- ============ ATTRIBUTES (hinh oval) - ten thuoc tinh + kieu du lieu ben duoi ============ -->
  <g>
    <!-- Genre attributes -->
    <ellipse cx="170" cy="70" rx="65" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="170" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#245a2f" text-decoration="underline">id</text>
    <text x="170" y="83" text-anchor="middle" font-size="10.5" fill="#4a7a52">INT</text>

    <ellipse cx="380" cy="70" rx="90" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="380" y="66" text-anchor="middle" font-size="13" fill="#245a2f">genre_name</text>
    <text x="380" y="83" text-anchor="middle" font-size="10.5" fill="#4a7a52">VARCHAR(50)</text>

    <!-- Game attributes -->
    <ellipse cx="640" cy="330" rx="60" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="640" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#245a2f" text-decoration="underline">id</text>
    <text x="640" y="343" text-anchor="middle" font-size="10.5" fill="#4a7a52">INT</text>

    <ellipse cx="925" cy="330" rx="90" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="925" y="326" text-anchor="middle" font-size="13" fill="#245a2f">game_name</text>
    <text x="925" y="343" text-anchor="middle" font-size="10.5" fill="#4a7a52">VARCHAR(200)</text>

    <!-- Publisher attributes -->
    <ellipse cx="1570" cy="70" rx="60" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="1570" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#245a2f" text-decoration="underline">id</text>
    <text x="1570" y="83" text-anchor="middle" font-size="10.5" fill="#4a7a52">INT</text>

    <ellipse cx="1795" cy="70" rx="100" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="1795" y="66" text-anchor="middle" font-size="13" fill="#245a2f">publisher_name</text>
    <text x="1795" y="83" text-anchor="middle" font-size="10.5" fill="#4a7a52">VARCHAR(100)</text>

    <!-- Game_Publisher attributes -->
    <ellipse cx="640" cy="752" rx="60" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="640" y="748" text-anchor="middle" font-size="13" font-weight="bold" fill="#245a2f" text-decoration="underline">id</text>
    <text x="640" y="765" text-anchor="middle" font-size="10.5" fill="#4a7a52">INT</text>

    <!-- Platform attributes -->
    <ellipse cx="1570" cy="705" rx="60" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="1570" y="701" text-anchor="middle" font-size="13" font-weight="bold" fill="#245a2f" text-decoration="underline">id</text>
    <text x="1570" y="718" text-anchor="middle" font-size="10.5" fill="#4a7a52">INT</text>

    <ellipse cx="1795" cy="705" rx="95" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="1795" y="701" text-anchor="middle" font-size="13" fill="#245a2f">platform_name</text>
    <text x="1795" y="718" text-anchor="middle" font-size="10.5" fill="#4a7a52">VARCHAR(50)</text>

    <!-- Game_Platform attributes -->
    <ellipse cx="640" cy="895" rx="60" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="640" y="891" text-anchor="middle" font-size="13" font-weight="bold" fill="#245a2f" text-decoration="underline">id</text>
    <text x="640" y="908" text-anchor="middle" font-size="10.5" fill="#4a7a52">INT</text>

    <ellipse cx="640" cy="985" rx="90" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="640" y="981" text-anchor="middle" font-size="13" fill="#245a2f">release_year</text>
    <text x="640" y="998" text-anchor="middle" font-size="10.5" fill="#4a7a52">INT</text>

    <!-- Region attributes -->
    <ellipse cx="650" cy="1280" rx="60" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="650" y="1276" text-anchor="middle" font-size="13" font-weight="bold" fill="#245a2f" text-decoration="underline">id</text>
    <text x="650" y="1293" text-anchor="middle" font-size="10.5" fill="#4a7a52">INT</text>

    <ellipse cx="915" cy="1280" rx="95" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="915" y="1276" text-anchor="middle" font-size="13" fill="#245a2f">region_name</text>
    <text x="915" y="1293" text-anchor="middle" font-size="10.5" fill="#4a7a52">VARCHAR(50)</text>

    <!-- Sold_in attributes -->
    <ellipse cx="1195" cy="1038" rx="85" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="1195" y="1034" text-anchor="middle" font-size="13" fill="#245a2f">num_sales</text>
    <text x="1195" y="1051" text-anchor="middle" font-size="10.5" fill="#4a7a52">DECIMAL(5,2)</text>

    <ellipse cx="1195" cy="1140" rx="85" ry="32" fill="#e9f7ea" stroke="#3f8f4f" stroke-width="2"/>
    <text x="1195" y="1136" text-anchor="middle" font-size="13" fill="#245a2f">updated_at</text>
    <text x="1195" y="1153" text-anchor="middle" font-size="10.5" fill="#4a7a52">DATETIME</text>
  </g>
</svg>
